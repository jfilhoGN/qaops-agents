# Test Report Template — QAOps Squad
# Use this template when generating pyramid coverage reports

template:
  name: test-report
  version: "1.0.0"
  output_format: markdown

structure: |
  # Pyramid Coverage Report: {{FEATURE_NAME}}

  **Version:** {{VERSION}}
  **Date:** {{DATE}}
  **Author:** Vega (QA Chief) — QAOps Squad
  **Status:** {{STATUS}}

  ---

  ## Pyramid Balance

  ```
          /    E2E    \       {{E2E_COUNT}} tests ({{E2E_PERCENT}}%)
         /--------------\
        /  Integration    \   {{INTEGRATION_COUNT}} tests ({{INTEGRATION_PERCENT}}%)
       /------------------\
      /    Unit Tests       \ {{UNIT_COUNT}} tests ({{UNIT_PERCENT}}%)
     /----------------------\
  ```

  | Layer | Count | Current | Target | Status |
  |-------|-------|---------|--------|--------|
  | Unit | {{UNIT_COUNT}} | {{UNIT_PERCENT}}% | 70% | {{UNIT_STATUS}} |
  | Integration | {{INTEGRATION_COUNT}} | {{INTEGRATION_PERCENT}}% | 20% | {{INTEGRATION_STATUS}} |
  | E2E | {{E2E_COUNT}} | {{E2E_PERCENT}}% | 10% | {{E2E_STATUS}} |
  | **Total** | **{{TOTAL_COUNT}}** | **100%** | — | **{{OVERALL_STATUS}}** |

  ## Balance Assessment

  **Verdict:** {{BALANCE_VERDICT}}

  {{BALANCE_EXPLANATION}}

  ## Coverage Matrix

  | Scenario | Unit | Integration | E2E | Gap? |
  |----------|------|-------------|-----|------|
  {{COVERAGE_ROWS}}

  ## Gaps Identified

  {{GAPS_LIST}}

  ## Specialist Outputs

  ### Sage (Analyst)
  - Scenarios derived: {{SCENARIO_COUNT}}
  - Traceability: {{TRACEABILITY_STATUS}}

  ### Prism (Unit)
  - Tests designed: {{UNIT_COUNT}}
  - Coverage target: {{UNIT_COVERAGE_TARGET}}
  - Mock strategy: {{MOCK_STRATEGY_STATUS}}

  ### Nexo (Integration)
  - Tests designed: {{INTEGRATION_COUNT}}
  - Contracts defined: {{CONTRACT_COUNT}}
  - Error paths: {{ERROR_PATH_STATUS}}

  ### Pixel (E2E)
  - Tests designed: {{E2E_COUNT}}
  - Page objects: {{PAGE_OBJECT_COUNT}}
  - Accessibility: {{A11Y_STATUS}}

  ## Recommendations

  {{RECOMMENDATIONS}}

